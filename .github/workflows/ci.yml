name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatage
        run: test -z "$(gofmt -l .)"
      - name: Analyse
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Compilation
        run: go build -o rudeclaude .
      - name: App de barre des menus
        if: runner.os == 'macOS'
        run: swift build --package-path macos/RudeClaudeBar
